name: ditonton
description: A Flutter catalog app for movies and TV series.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  equatable: ^2.0.5
  google_fonts: ^8.0.2
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1
  get_it: ^7.7.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  firebase_core: ^4.7.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.6
  bloc_test: ^10.0.0
  build_runner: ^2.4.12
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/certificates/
